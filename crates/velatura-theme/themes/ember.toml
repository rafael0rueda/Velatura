# Bundled with Velatura. Colors only: see docs/plan.html, section 3.
schema = 1
derive = 1

[meta]
id          = "ember"
name        = "Ember"
author      = "Rafael Rueda"
license     = "MIT"
description = "Warm and dim, almost no blue, with an orange accent."

[variants.default]
name       = "Ember"
appearance = "dark"

# Named after the Kanagawa colors they replace (kanagawa.nvim, Tommaso Laurenzi, MIT).
[variants.default.palette]
sumi_ink_0      = "#110D0F"
sumi_ink_1      = "#141012"
sumi_ink_2      = "#161114"
sumi_ink_3      = "#191316"
sumi_ink_4      = "#261C20"
sumi_ink_5      = "#36282B"
sumi_ink_6      = "#5E4744"
tab_ink         = "#0E0A0C"
wave_blue_1     = "#33242A"
wave_blue_2     = "#4A3230"
winter_green    = "#23261C"
winter_yellow   = "#38291E"
winter_red      = "#3D2024"
winter_blue     = "#2A2028"
ink_violet      = "#4F3626"
ink_violet_hi   = "#604230"
fuji_white      = "#DBC7B0"
old_white       = "#C2AD96"
fuji_gray       = "#8A7068"
katana_gray     = "#857670"
spring_violet_1 = "#A8929A"
spring_violet_2 = "#BBA6A6"
oni_violet_2    = "#D6BDB0"
oni_violet      = "#E0914F"
crystal_blue    = "#A9A0B8"
spring_blue     = "#BFA5AE"
spring_blue_dim = "#A8909A"
light_blue      = "#C9BDB5"
wave_aqua_1     = "#86987F"
wave_aqua_2     = "#9DB09A"
dragon_blue     = "#9A9482"
spring_green    = "#A3AD72"
autumn_green    = "#8A9460"
wave_red        = "#D9897A"
peach_red       = "#E07A62"
samurai_red     = "#D95F52"
autumn_red      = "#BF6257"
surimi_orange   = "#DFA06E"
ronin_yellow    = "#E0A458"
autumn_yellow   = "#C99A5E"
carp_yellow     = "#D9BC85"
boat_yellow_1   = "#8F7B58"
boat_yellow_2   = "#BFA070"
sakura_pink     = "#D98C8C"
syntax_violet   = "#B98AA6"

[variants.default.ui]
bg           = "@sumi_ink_3"
fg           = "@fuji_white"
accent       = "@oni_violet"
bg_dim       = "@sumi_ink_0"
surface      = "@sumi_ink_4"
border       = "@sumi_ink_5"
fg_muted     = "@old_white"
fg_subtle    = "@fuji_gray"
accent_fg    = "@sumi_ink_3"
selection_bg = "@wave_blue_2"
selection_fg = "@old_white"
cursor       = "@old_white"
cursor_fg    = "@sumi_ink_3"
link         = "@spring_blue_dim"
success      = "@spring_green"
warning      = "@ronin_yellow"
error        = "@samurai_red"

[variants.default.ansi]
black          = "@sumi_ink_0"
red            = "@autumn_red"
green          = "@autumn_green"
yellow         = "@boat_yellow_2"
blue           = "@crystal_blue"
magenta        = "@syntax_violet"
cyan           = "@wave_aqua_1"
white          = "@old_white"
bright_black   = "@fuji_gray"
bright_red     = "@samurai_red"
bright_green   = "@spring_green"
bright_yellow  = "@carp_yellow"
bright_blue    = "@spring_blue"
bright_magenta = "@spring_violet_1"
bright_cyan    = "@wave_aqua_2"
bright_white   = "@fuji_white"

[variants.default.syntax]
comment     = "@fuji_gray"
keyword     = "@syntax_violet"
string      = "@spring_green"
number      = "@sakura_pink"
constant    = "@surimi_orange"
function    = "@crystal_blue"
type        = "@wave_aqua_2"
variable    = "@fuji_white"
parameter   = "@oni_violet_2"
operator    = "@boat_yellow_2"
punctuation = "@spring_violet_2"
property    = "@carp_yellow"
tag         = "@wave_red"
attribute   = "@autumn_yellow"
builtin     = "@spring_blue"
escape      = "@peach_red"

[variants.default.diff]
add    = "@winter_green"
change = "@winter_yellow"
delete = "@winter_red"
text   = "@winter_blue"

[variants.default.diagnostic]
error   = "@samurai_red"
warning = "@ronin_yellow"
info    = "@dragon_blue"
hint    = "@wave_aqua_1"
ok      = "@spring_green"

[variants.default.slots.starship]
directory = "#D9B56C"
git       = "#C2705C"
language  = "#9FA872"
