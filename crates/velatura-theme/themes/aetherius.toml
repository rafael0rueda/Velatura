# Bundled with Velatura. Colors only: see docs/plan.html, section 3.
schema = 1
derive = 1

[meta]
id          = "aetherius"
name        = "Aetherius"
author      = "Rafael Rueda"
license     = "MIT"
description = "Starlit indigo with a periwinkle accent."

[variants.default]
name       = "Aetherius"
appearance = "dark"

# Named after the Kanagawa colors they replace (kanagawa.nvim, Tommaso Laurenzi, MIT).
[variants.default.palette]
sumi_ink_0      = "#0D101A"
sumi_ink_1      = "#10131F"
sumi_ink_2      = "#121622"
sumi_ink_3      = "#141826"
sumi_ink_4      = "#1E2438"
sumi_ink_5      = "#2A3250"
sumi_ink_6      = "#4A5580"
tab_ink         = "#0B0E17"
wave_blue_1     = "#232B45"
wave_blue_2     = "#303A5E"
winter_green    = "#1D2B2A"
winter_yellow   = "#33303A"
winter_red      = "#3A2433"
winter_blue     = "#1C2540"
ink_violet      = "#353F68"
ink_violet_hi   = "#414D7C"
fuji_white      = "#D3D9EE"
old_white       = "#B4BCD8"
fuji_gray       = "#6C76A0"
katana_gray     = "#6B7896"
spring_violet_1 = "#8E94BE"
spring_violet_2 = "#A3B1D6"
oni_violet_2    = "#BCC3E2"
oni_violet      = "#8493D8"
crystal_blue    = "#7FA6DC"
spring_blue     = "#74BDE0"
spring_blue_dim = "#5FA9C6"
light_blue      = "#A5D8E6"
wave_aqua_1     = "#4795AE"
wave_aqua_2     = "#52ADC9"
dragon_blue     = "#5B8FAE"
spring_green    = "#84B56E"
autumn_green    = "#6E9C5E"
wave_red        = "#E0877B"
peach_red       = "#E8776F"
samurai_red     = "#E5625E"
autumn_red      = "#C9665F"
surimi_orange   = "#E9A882"
ronin_yellow    = "#EBA868"
autumn_yellow   = "#D4A56E"
carp_yellow     = "#D9C38E"
boat_yellow_1   = "#94846A"
boat_yellow_2   = "#C2A878"
sakura_pink     = "#CC7F9C"
syntax_violet   = "#A08CD0"

[variants.default.ui]
bg           = "@sumi_ink_3"
fg           = "@fuji_white"
accent       = "@oni_violet"
bg_dim       = "@sumi_ink_0"
surface      = "@sumi_ink_4"
border       = "@sumi_ink_5"
fg_muted     = "@old_white"
fg_subtle    = "@fuji_gray"
accent_fg    = "@sumi_ink_3"
selection_bg = "@wave_blue_2"
selection_fg = "@old_white"
cursor       = "@old_white"
cursor_fg    = "@sumi_ink_3"
link         = "@spring_blue_dim"
success      = "@spring_green"
warning      = "@ronin_yellow"
error        = "@samurai_red"

[variants.default.ansi]
black          = "@sumi_ink_0"
red            = "@autumn_red"
green          = "@autumn_green"
yellow         = "@boat_yellow_2"
blue           = "@crystal_blue"
magenta        = "@syntax_violet"
cyan           = "@wave_aqua_1"
white          = "@old_white"
bright_black   = "@fuji_gray"
bright_red     = "@samurai_red"
bright_green   = "@spring_green"
bright_yellow  = "@carp_yellow"
bright_blue    = "@spring_blue"
bright_magenta = "@spring_violet_1"
bright_cyan    = "@wave_aqua_2"
bright_white   = "@fuji_white"

[variants.default.syntax]
comment     = "@fuji_gray"
keyword     = "@syntax_violet"
string      = "@spring_green"
number      = "@sakura_pink"
constant    = "@surimi_orange"
function    = "@crystal_blue"
type        = "@wave_aqua_2"
variable    = "@fuji_white"
parameter   = "@oni_violet_2"
operator    = "@boat_yellow_2"
punctuation = "@spring_violet_2"
property    = "@carp_yellow"
tag         = "@wave_red"
attribute   = "@autumn_yellow"
builtin     = "@spring_blue"
escape      = "@peach_red"

[variants.default.diff]
add    = "@winter_green"
change = "@winter_yellow"
delete = "@winter_red"
text   = "@winter_blue"

[variants.default.diagnostic]
error   = "@samurai_red"
warning = "@ronin_yellow"
info    = "@dragon_blue"
hint    = "@wave_aqua_1"
ok      = "@spring_green"

# The prompt's segments as the Kanagawa prompt had them: directory, git, language.
[variants.default.slots.starship]
directory = "@crystal_blue"
git       = "@sakura_pink"
language  = "@wave_aqua_2"
