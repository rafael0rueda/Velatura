[package]
name = "velatura-engine"
description = "Host access, plans and transactions for Velatura."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Read and write GNOME settings through GIO. Needs the GLib development files.
gio = ["dep:gio"]

[dependencies]
gio = { version = "0.22", optional = true, default-features = false }
serde_json = { version = "1", default-features = false, features = ["std"] }
toml = { version = "1.1", default-features = false, features = ["std", "parse", "serde"] }
xattr = { version = "1.6", default-features = false }
velatura-theme = { path = "../velatura-theme" }

[lints]
workspace = true
