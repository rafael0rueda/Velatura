name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install tools
        run: dnf install -y --setopt=install_weak_deps=False git cargo rustfmt clippy gcc python3 pkgconf-pkg-config glib2-devel dbus-daemon dconf gsettings-desktop-schemas gtk3 gtk4 python3-gobject gobject-introspection gtk4-devel libadwaita-devel gettext desktop-file-utils
      - uses: actions/checkout@v4
      - name: Gate
        run: VELATURA_CI=1 scripts/check.sh
