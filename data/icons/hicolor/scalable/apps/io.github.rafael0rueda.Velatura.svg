<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- A fan of three paint chips pinned at one point, each topped with a
       theme colour, on a lit tile over a darker base edge. -->
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b5abfc"/>
      <stop offset="1" stop-color="#796cbf"/>
    </linearGradient>
  </defs>
  <!-- tile: base edge, face, and a faint rim of light -->
  <rect x="12" y="17" width="104" height="104" rx="24" fill="#423a6a"/>
  <rect x="12" y="10" width="104" height="104" rx="24" fill="url(#face)"/>
  <rect x="12.5" y="10.5" width="103" height="103" rx="23.5" fill="none" stroke="#f5f4ff" stroke-opacity=".3"/>
  <!-- the chips: blue behind on the left, orange behind on the right, red in front -->
  <g transform="rotate(-30 64 90)">
    <rect x="51" y="30" width="26" height="66" rx="7" fill="#d2cefd"/>
    <path d="M51 37a7 7 0 0 1 7-7h12a7 7 0 0 1 7 7v13h-26z" fill="#7aa2e0"/>
  </g>
  <g transform="rotate(30 64 90)">
    <rect x="51" y="30" width="26" height="66" rx="7" fill="#e7e5fe"/>
    <path d="M51 37a7 7 0 0 1 7-7h12a7 7 0 0 1 7 7v13h-26z" fill="#e8934a"/>
  </g>
  <rect x="51" y="30" width="26" height="66" rx="7" fill="#f5f4ff"/>
  <path d="M51 37a7 7 0 0 1 7-7h12a7 7 0 0 1 7 7v13h-26z" fill="#e0353f"/>
  <!-- the pin -->
  <circle cx="64" cy="86" r="4.5" fill="#5d5294"/>
</svg>
