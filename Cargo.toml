[workspace]
resolver = "3"
members = ["crates/velatura-theme", "crates/velatura-engine", "crates/velatura-text", "crates/velatura-cli", "crates/velatura-gui"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-or-later"
repository = "https://github.com/rafael0rueda/Velatura"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
